<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071018"><title>RT15 WT – Amalfi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02070b;color:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;background:#071018;position:relative;overflow:hidden}header{height:64px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;background:rgba(7,16,24,.96);z-index:4;font-weight:700}
main{padding:0 16px 90px;width:100%;max-width:520px;margin:0 auto}.hero{height:100vh;margin:0 -16px;position:relative;overflow:hidden;background-image:url('./home.jpg');background-size:cover;background-position:center top;border-radius:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(2,7,11,.95) 95%)}
.heroText{position:absolute;z-index:1;left:24px;right:24px;bottom:62px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.45)}h1{font-size:40px;font-style:italic;font-weight:500;margin:8px 0 4px}
.heroLogo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto}.city{font-size:11px;color:#ff9d20;letter-spacing:2px;text-transform:uppercase}.next{background:rgba(5,12,18,.94);border:1px solid #24313d;border-radius:17px;padding:17px}.next b{color:#ff9d20;font-size:11px;text-transform:uppercase;letter-spacing:1px}.next p{line-height:1.45}
.section{text-align:center;padding:14px 0 10px}.section h2{margin:0;font-size:23px}.section small{color:#ff9d20;text-transform:uppercase}
.days{display:flex;gap:7px;margin-bottom:13px}.days button{flex:1;border:1px solid #24313d;background:#101c27;color:#a9b1b7;border-radius:11px;padding:10px 4px;font-weight:700}.days button.active{background:#ff9d20;color:#111;border-color:#ff9d20}
.card{background:#101c27;border:1px solid #24313d;border-radius:16px;overflow:hidden;margin:10px 0;cursor:pointer}.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.cardText{padding:13px 15px;display:flex;justify-content:space-between;gap:10px}.title{font-size:14px;line-height:1.4}.time{color:#a9b1b7;font-size:12px;margin-top:3px}.arrow{font-size:25px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:rgba(7,16,24,.98);border-top:1px solid #24313d;display:flex;z-index:8}.nav button{flex:1;background:none;border:0;color:#a9b1b7;font-size:11px}.nav button.active{color:#ff9d20}.ico{font-size:22px;display:block}
.page{display:none}.page.active{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:min(520px,100%);max-height:90vh;overflow:auto;background:#0c1720;border-radius:24px 24px 0 0}.sheet img{width:100%;aspect-ratio:16/9;object-fit:cover}.inner{padding:20px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;background:#1b2935;color:#fff;font-size:20px;margin-top:-2px}.sheet h2{font-size:23px;margin:6px 0 15px}.sheet p{color:#d5d9dc;line-height:1.55}.sheet a{display:block;background:#ff9d20;color:#111;text-decoration:none;text-align:center;font-weight:800;border-radius:12px;padding:13px;margin-top:15px}
.app:has(#home.active) > header{display:none}.app:has(#home.active) #home main{padding:0 16px 0}.app:has(#home.active) .next{position:absolute;z-index:3;left:32px;right:32px;bottom:82px;margin:0;padding:17px;border-radius:17px}.app:has(#home.active) .hero{height:100vh}.app:has(#home.active) .heroText{display:none}</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RT15 Amalfi">
<meta name="robots" content="noindex,nofollow,noarchive">
</head>
<body><div class="app"><header>RT15 WT · AMALFI</header>
<section id="home" class="page active"><main>
<div class="hero"><div class="heroText"><img class="heroLogo" src="" alt="RT15 Holbæk logo"><h1>RT15 WT – Amalfi</h1><div class="city">Positano</div></div></div>
<div class="next"><b>Næste aktivitet</b><p>✈️ 25 september · CPH → NAP<br>08.05–10.45</p></div>
</main></section>
<section id="program" class="page"><main><div class="section"><h2 id="dayTitle">DAG 1</h2><small id="dateTitle">25 september</small></div>
<div class="days"><button class="active" onclick="day(1,this)">25 SEP</button><button onclick="day(2,this)">26 SEP</button><button onclick="day(3,this)">27 SEP</button></div>
<div id="cards"></div></main></section>
<nav class="nav"><button class="active" onclick="show('home',this)"><span class="ico">⌂</span>FORSIDE</button><button onclick="show('program',this)"><span class="ico">☷</span>PROGRAM</button></nav>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><img id="mi"><div class="inner"><button class="close" onclick="closeM()">×</button><h2 id="mt"></h2><div id="mb"></div></div></div></div>
<script>
const items=[{day:'25 SEP',img:'./flight.jpg',title:'25 september: CPH-NAP',time:'08.05–10.45',body:"<b>Fly · SAS · SK 2681</b><p>CPH → NAP<br>Afgang 08.05 · Ankomst 10.45</p><a href='https://www.sas.dk/' target='_blank'>Åbn SAS</a>"},{day:'25 SEP',img:'./vesuv.jpg',title:'25 september – Hiking and dining on Vesuv',time:'12.00–16.30',body:'<p>Vesuv er den berømte vulkan ved Napoli.<br>Vi vandrer helt op til kraterkanten, og får den vilde udsigt ned i vulkanen, og ud over napolibugten.</p><p>Vidste du i øvrigt at Vesuv er en aktiv vulkan? Den er i øjeblikket i ”dvalefasen”. Til sammenligning gik vulkanen Etna på Sicilien i udbrud i august i år!</p><p>Vi spiser frokost i området omkring Vesuv….. Forhåbentlig!</p><div class="info"><div class="row"><span class="label">Tid</span><b>12.00–16.30</b></div><div class="row"><span class="label">Aktivitet</span><b>Hiking & dining</b></div></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Vesuvius+National+Park" target="_blank">Åbn i Google Maps</a>'},{day:'25 SEP',img:'./hotel.jpg',title:'25 september – Posa Posa Hotel',time:'Check-in 18.00',body:"<p>Vores hotel i Positano. Her kan vi senere indsætte den endelige adresse og en direkte Google Maps-rute.</p><a href='https://www.google.com/maps/search/?api=1&query=Posa+Posa+Hotel+Positano' target='_blank'>Åbn Google Maps</a>"},{day:'25 SEP',img:'./restaurant.jpg',title:'25 september – Middag på La Pergola',time:'20.00–22.30',body:'<p>La Pergola ligger direkte ved Spiaggia Grande i Positano og beskriver selv stedet som et historisk restaurantsted med en historie på mere end 100 år.</p><p>Restauranten er en del af Buca di Bacco, et af Positanos historiske steder. Buca di Bacco fortæller om en lang række berømte gæster gennem tiden – bl.a. Liz Taylor, Vittorio De Sica, Alberto Sordi, Franco Zeffirelli og Sir Laurence Olivier.</p><p>Så vi går altså til middag et sted med en ret seriøs Positano-historie. 🍷</p><div class="info"><div class="row"><span class="label">Tid</span><b>20.00–22.30</b></div><div class="row"><span class="label">Sted</span><b>La Pergola</b></div><div class="row"><span class="label">Adresse</span><b>Via del Brigantino 35/37</b></div></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=La+Pergola%2C+Via+del+Brigantino+35%2F37%2C+Positano" target="_blank">Åbn i Google Maps</a>'},{day:'25 SEP',img:'./music.jpg',title:'25 september – Music on the rocks',time:'23.30–06.00',body:'<p><b>Music on the Rocks</b> er ikke ligefrem en almindelig natklub. Klubben er bygget direkte ind i klippen under Positano, helt nede ved vandet.</p><p>Rå klippevægge, havet lige udenfor og musik til langt ud på natten gør det til en ret særlig Positano-oplevelse. Vi starter aftenen kl. 23.30 – og så må vi se, hvor længe vi holder den kørende. 🕺🍾</p><div class="info"><div class="row"><span class="label">Tid</span><b>23.30–06.00</b></div><div class="row"><span class="label">Adresse</span><b>Località Grotte Dell&apos;Incanto 51</b></div></div><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Music+on+the+Rocks%2C+Localit%C3%A0+Grotte+Dell%27Incanto+51%2C+Positano" target="_blank">Åbn i Google Maps</a>'},{day:'26 SEP',img:'./yacht-approved.png',title:'26 september – Amalfi Coast & Capri',time:'10.00–18.00',body:'<p>Vi sejler langs Amalfikysten mod Capri på en 78 fods Azimut Ultra. Undervejs: Den Blå Lagune, snorkling, mad og fri bar.</p><p><b>10.00–18.00 · 17 personer</b></p>'},{day:'26 SEP',img:'./restaurant.jpg',title:'26 september – Middag i Positano',time:'19.00–21.00',body:'<p>Fælles middag i Positano. Restaurantnavn, adresse og reservation indsættes senere.</p>'},{day:'27 SEP',img:'./transfer.jpg',title:'27 september – Transfer pick up ved hotellet',time:'09.30',body:"<p>Transfer afhenter gruppen ved Posa Posa Hotel kl. 09.30.</p><p>Vi kører samlet til Napoli Central Station, hvor vi forventer at ankomme omkring kl. 11.00.</p><a href='https://www.google.com/maps/search/?api=1&query=Posa+Posa+Hotel+Positano' target='_blank'>Åbn Google Maps</a>"},{day:'27 SEP',img:'./napoli.jpg',title:'27 september – Napoli, shopping & frokost',time:'11.00–13.00',body:'<p>Vi går fælles fra <b>Napoli Central Station</b> til <b>O’ Sile Mio Pizza</b> i Napoli, hvor vi starter dagen med napolitansk pizza.</p><p>Den napolitanske pizzakunst blev i 2017 optaget på UNESCOs liste over immateriel kulturarv. Så frokosten er faktisk en del af Napolis kulturarv. 🍕</p><p>Derefter er der <b>fri leg og shopping i Napolis gader</b>.</p><p><b>Til lufthavnen:</b> Når vi er færdige i byen, går man tilbage til <b>Piazza Garibaldi</b> foran Napoli Central Station. Her finder man <b>Alibus</b> mod <b>Aeroporto di Capodichino</b>.</p><p>Alibus er den direkte lufthavnsshuttle. Den kører cirka hvert 15. minut, og turen til Napoli Lufthavn tager omkring 15 minutter.</p><p><b>Ved lufthavnen:</b> Stå af ved Napoli Airport / terminalområdet og gå til <b>Terminal 1</b>.</p><p>✈️ <b>Vi mødes SENEST kl. 13.55 ved Terminal 1.</b></p><a href="https://www.google.com/maps/search/?api=1&query=O%27Sile%20Mio%20Pizza%20Napoli" target="_blank">Åbn i Google Maps</a>'},{day:'27 SEP',img:'./returnflight.jpg',title:'27 september: NAP-CPH',time:'15.55–18.35',body:"<b>Fly · SAS · SK 2682</b><p>NAP → CPH<br>Afgang 15.55 · Ankomst 18.35</p><a href='https://www.sas.dk/' target='_blank'>Åbn SAS</a>"}];
let cur=1;
function show(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='program')render()}
function day(n,b){cur=n;document.querySelectorAll('.days button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){document.getElementById('dayTitle').textContent='DAG '+cur;document.getElementById('dateTitle').textContent=cur===1?'25 september':cur===2?'26 september':'27 september';document.getElementById('cards').innerHTML=items.filter(x=>x.day.startsWith(String(25+cur-1))).map((x,i)=>`<div class="card" onclick="openM(${items.indexOf(x)})"><img src="${x.img}"><div class="cardText"><div><div class="title">${x.title}</div><div class="time">${x.time}</div></div><div class="arrow">›</div></div></div>`).join('')}
function openM(i){let x=items[i];document.getElementById('mi').src=x.img;document.getElementById('mt').textContent=x.title;document.getElementById('mb').innerHTML=x.body;document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open')} render();
</script>
<script>
(async()=>{
  const p=new URLSearchParams(location.search);
  const token=p.get('invite')||localStorage.getItem('rt15_invite');
  try{
    const r=await fetch('./config/invites.json',{cache:'no-store'});
    const cfg=await r.json();
    if(cfg.enabled && (!token || !cfg.tokens.includes(token))){
      document.documentElement.innerHTML='<body style="margin:0;background:#070b12;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial;display:grid;place-items:center;min-height:100vh"><div style="text-align:center;padding:32px"><div style="font-size:42px;margin-bottom:16px">🔒</div><h1 style="margin:0 0 10px">Privat invitation</h1><p style="opacity:.7">Denne side kræver et gyldigt RT15-link.</p></div></body>';
      return;
    }
    if(token) localStorage.setItem('rt15_invite',token);
    const pr=await fetch('./config/program.json',{cache:'no-store'});
    if(pr.ok){ window.RT15_PROGRAM=await pr.json(); }
  }catch(e){
    // Keep the bundled UI available if the optional online config is temporarily unavailable.
  }
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
})();
</script>
</body></html>
